# Journalisation de l'application : seuls les avertissements/erreurs de Spark sont affichés.
# Sortie sur stdout pour que sbt / IntelliJ n'affichent pas chaque ligne comme [error].
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %-5p %c{1} - %m%n

# Avertissements attendus et sans gravité en local
logger.shell.name = org.apache.hadoop.util.Shell
logger.shell.level = error
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
# ntile() sur l'ensemble des clients (segmentation RFM) : fenêtre globale volontaire (~11 000 lignes)
logger.window.name = org.apache.spark.sql.execution.window.WindowExec
logger.window.level = error
