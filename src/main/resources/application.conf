app {
  name = "EcommerceAnalytics"

  spark {
    master = "local[*]"          # ignoré si spark-submit fournit --master
    shuffle.partitions = 8
    timezone = "UTC"
  }

  optimization {
    enable-cache = true          # cache()/persist() des DataFrame réutilisés
    enable-broadcast = true      # broadcast() des petites tables lors des jointures
  }

  data {
    input {
      transactions = "data/transactions.csv"
      users        = "data/users.json"
      products     = "data/products.parquet"
      merchants    = "data/merchants.csv"
    }
    output {
      path = "output/"
    }
  }

  validation {
    transaction { timestamp-length = 14 }
    user        { min-age = 16, max-age = 100 }
    product     { min-rating = 1.0, max-rating = 5.0 }
    merchant    { min-commission = 0.0, max-commission = 1.0 }
  }

  features {
    working-hours { start = 9, end = 17 }   # is_working_hours = 1 si start <= heure <= end
    active-user   { min-distinct-days = 5 } # sur 7 jours glissants
  }

  suspicious {
    amount-threshold-pct  = 300.0   # dépassement du panier moyen (en %)
    max-delay-minutes     = 5.0
    min-conditions        = 2
  }
}
